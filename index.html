<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade: Gerenciamento e Busca de IPs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card-header { background-color: #4a4a4a; color: white; border-radius: 0 !important; }
        .card { border: none; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .table th { background-color: #f1f1f1; }
        .editable-cell input {
            width: 100%;
            box-sizing: border-box;
            padding: 2px 5px;
        }
        .btn-clear { cursor: pointer; color: black; font-weight: bold; }
    </style>
</head>
<body>

<div class="container mt-5 mb-5">

    <div class="card mb-5 p-3">
        <h2 class="text-center fw-bold mt-3 mb-4">IP API</h2>
        
        <div class="row mb-4 px-3">
            <div class="col-md-9">
                <input type="text" id="ipSearchInput" class="form-control" placeholder="Ex: 8.8.8.8">
            </div>
            <div class="col-md-3">
                <button id="btnSearch" class="btn btn-success w-100">Pesquisar</button>
            </div>
        </div>

        <div class="px-3">
            <table class="table text-center align-middle">
                <thead>
                    <tr>
                        <th>IP</th>
                        <th>Org</th>
                        <th>Country</th>
                        <th>City</th>
                        <th>Clear</th>
                    </tr>
                </thead>
                <tbody id="apiTableBody">
                </tbody>
            </table>
        </div>
    </div>
    <div class="card p-3">
        <h2 class="text-center fw-bold mt-3 mb-4">IP Table</h2>
        
        <div class="row mb-4 px-3">
            <div class="col-md-4">
                <input type="text" id="ipInput" class="form-control" placeholder="IP">
            </div>
            <div class="col-md-4">
                <input type="text" id="maskInput" class="form-control" placeholder="Mask">
            </div>
            <div class="col-md-3">
                <input type="text" id="versionInput" class="form-control" placeholder="Version">
            </div>
            <div class="col-md-1">
                <button id="btnAddIp" class="btn btn-primary w-100">Add</button>
            </div>
        </div>

        <div class="px-3">
            <table class="table text-center align-middle" id="crudTable">
                <thead>
                    <tr>
                        <th>IP</th>
                        <th>Mask</th>
                        <th>Version</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="crudTableBody">
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    const API_TOKEN = 'SEU_TOKEN_AQUI'; 

    document.getElementById('btnSearch').addEventListener('click', async () => {
        const ip = document.getElementById('ipSearchInput').value.trim();
        if (!ip) return alert("Digite um IP válido para pesquisar.");

        try {
            const response = await fetch(`https://ipinfo.io/${ip}/json?token=${API_TOKEN}`);
            const data = await response.json();

            if (data.error) throw new Error("IP não encontrado");

            const tbody = document.getElementById('apiTableBody');
            const row = document.createElement('tr');

            row.innerHTML = `
                <td>${data.ip}</td>
                <td>${data.org || '-'}</td>
                <td>${data.country || '-'}</td>
                <td>${data.city || '-'}</td>
                <td><span class="btn-clear fs-5" onclick="this.closest('tr').remove()">✖</span></td>
            `;
            
            tbody.appendChild(row);
            document.getElementById('ipSearchInput').value = ''; // Limpa o input

        } catch (error) {
            alert("Erro ao buscar informações do IP. Verifique o token ou o endereço inserido.");
            console.error(error);
        }
    });

    document.getElementById('btnAddIp').addEventListener('click', () => {
        const ip = document.getElementById('ipInput').value.trim();
        const mask = document.getElementById('maskInput').value.trim();
        const version = document.getElementById('versionInput').value.trim() || '-';

        if (!ip || !mask) return alert("Os campos IP e Mask são obrigatórios.");

        const tbody = document.getElementById('crudTableBody');
        const row = document.createElement('tr');

        row.innerHTML = `
            <td onclick="makeEditable(this)">${ip}</td>
            <td onclick="makeEditable(this)">${mask}</td>
            <td onclick="makeEditable(this)">${version}</td>
            <td><button class="btn btn-sm btn-danger" onclick="this.closest('tr').remove()">Excluir</button></td>
        `;

        tbody.appendChild(row);

        document.getElementById('ipInput').value = '';
        document.getElementById('maskInput').value = '';
        document.getElementById('versionInput').value = '';
    });

        function makeEditable(cell) {
        if (cell.querySelector('input')) return; 

        const originalText = cell.innerText;
        cell.classList.add('editable-cell');
        
        cell.innerHTML = `<input type="text" class="form-control form-control-sm" value="${originalText}">`;
        
        const input = cell.querySelector('input');
        input.focus();

        
        input.addEventListener('blur', () => saveEdit(cell, input.value));
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveEdit(cell, input.value);
        });
    }

    function saveEdit(cell, newValue) {
        cell.classList.remove('editable-cell');
        cell.innerHTML = newValue.trim() || '-'; 
    }
</script>

</body>
</html>
