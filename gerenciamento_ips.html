<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de IPs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-top: 20px;}
        .table th { background-color: #f1f1f1; }
        .editable-cell input { width: 100%; box-sizing: border-box; padding: 2px 5px; }
    </style>
</head>
<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Minha Atividade</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="busca_api.html">1. Busca IP (API)</a></li>
                <li class="nav-item"><a class="nav-link active" href="gerenciamento_ips.html">2. Gerenciar IPs</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <div class="card p-3">
        <h2 class="text-center fw-bold mt-3 mb-4">IP Table (Gerenciamento)</h2>
        
        
        <div class="row mb-4 px-3">
            <div class="col-md-4">
                <input type="text" id="ipInput" class="form-control" placeholder="IP">
            </div>
            <div class="col-md-4">
                <input type="text" id="maskInput" class="form-control" placeholder="Mask">
            </div>
            <div class="col-md-3">
                <input type="text" id="versionInput" class="form-control" placeholder="Version">
            </div>
            <div class="col-md-1">
                <button id="btnAddIp" class="btn btn-primary w-100">Add</button>
            </div>
        </div>

        
        <div class="row mb-3 px-3">
            <div class="col-md-12">
                <input type="text" id="localSearchInput" class="form-control border-info" placeholder="Pesquisar IP cadastrado na tabela abaixo...">
            </div>
        </div>

        <!-- Tabela -->
        <div class="px-3">
            <table class="table text-center align-middle" id="crudTable">
                <thead>
                    <tr>
                        <th>IP</th>
                        <th>Mask</th>
                        <th>Version</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="crudTableBody">
                    
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    
    document.getElementById('btnAddIp').addEventListener('click', () => {
        const ip = document.getElementById('ipInput').value.trim();
        const mask = document.getElementById('maskInput').value.trim();
        const version = document.getElementById('versionInput').value.trim() || '-';

        if (!ip || !mask) return alert("Os campos IP e Mask são obrigatórios.");

        const tbody = document.getElementById('crudTableBody');
        const row = document.createElement('tr');

        row.innerHTML = `
            <td onclick="makeEditable(this)">${ip}</td>
            <td onclick="makeEditable(this)">${mask}</td>
            <td onclick="makeEditable(this)">${version}</td>
            <td><button class="btn btn-sm btn-danger" onclick="this.closest('tr').remove()">Excluir</button></td>
        `;

        tbody.appendChild(row);

        
        document.getElementById('ipInput').value = '';
        document.getElementById('maskInput').value = '';
        document.getElementById('versionInput').value = '';
    });

    // 2. Função de Pesquisa Local na Tabela
    document.getElementById('localSearchInput').addEventListener('keyup', function() {
        let valorPesquisado = this.value.toLowerCase();
        let linhas = document.querySelectorAll('#crudTableBody tr');

        linhas.forEach(linha => {
           
            let ipDaLinha = linha.cells[0].textContent.toLowerCase();
            
            
            if (ipDaLinha.includes(valorPesquisado)) {
                linha.style.display = '';
            } else {
                linha.style.display = 'none';
            }
        });
    });

    
    function makeEditable(cell) {
        if (cell.querySelector('input')) return; 

        const originalText = cell.innerText;
        cell.classList.add('editable-cell');
        cell.innerHTML = `<input type="text" class="form-control form-control-sm" value="${originalText}">`;
        
        const input = cell.querySelector('input');
        input.focus();

        input.addEventListener('blur', () => saveEdit(cell, input.value));
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveEdit(cell, input.value);
        });
    }

    function saveEdit(cell, newValue) {
        cell.classList.remove('editable-cell');
        cell.innerHTML = newValue.trim() || '-';
    }
</script>
</body>
</html>
