<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de IP (API)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-top: 20px;}
        .table th { background-color: #f1f1f1; }
        .btn-clear { cursor: pointer; color: black; font-weight: bold; }
    </style>
</head>
<body>

<!-- Menu de Navegação -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Minha Atividade</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="busca_api.html">1. Busca IP (API)</a></li>
                <li class="nav-item"><a class="nav-link" href="gerenciamento_ips.html">2. Gerenciar IPs</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <div class="card p-3">
        <h2 class="text-center fw-bold mt-3 mb-4">IP API</h2>
        
        <div class="row mb-4 px-3">
            <div class="col-md-9">
                <input type="text" id="ipSearchInput" class="form-control" placeholder="Ex: 8.8.8.8">
            </div>
            <div class="col-md-3">
                <button id="btnSearch" class="btn btn-success w-100">Pesquisar na API</button>
            </div>
        </div>

        <div class="px-3">
            <table class="table text-center align-middle">
                <thead>
                    <tr>
                        <th>IP</th>
                        <th>Org</th>
                        <th>Country</th>
                        <th>City</th>
                        <th>Clear</th>
                    </tr>
                </thead>
                <tbody id="apiTableBody">
                    
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    
    const API_TOKEN = '4feacdef664d6bI'; 

    document.getElementById('btnSearch').addEventListener('click', async () => {
        const ip = document.getElementById('ipSearchInput').value.trim();
        if (!ip) return alert("Digite um IP válido para pesquisar.");

        try {
            const response = await fetch(`https://ipinfo.io/${ip}/json`);
            const data = await response.json();

            if (data.error) throw new Error("IP não encontrado");

            const tbody = document.getElementById('apiTableBody');
            const row = document.createElement('tr');

            row.innerHTML = `
                <td>${data.ip}</td>
                <td>${data.org || '-'}</td>
                <td>${data.country || '-'}</td>
                <td>${data.city || '-'}</td>
                <td><span class="btn-clear fs-5" onclick="this.closest('tr').remove()">✖</span></td>
            `;
            
            tbody.appendChild(row);
            document.getElementById('ipSearchInput').value = ''; 

        } catch (error) {
            alert("Erro ao buscar informações do IP. Verifique o endereço.");
        }
    });
</script>
</body>
</html>
